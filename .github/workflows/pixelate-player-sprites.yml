name: Pixelate player sprites

on:
  push:
    branches:
      - 'chatgpt/pixelate-player-sprites'

permissions:
  contents: write

jobs:
  pixelate:
    if: "!contains(github.event.head_commit.message, '[pixelated]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Pixelate player sprite sheets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = [
              Path('Assets/Character/Sprites/PlayerDeath.png'),
              Path('Assets/Character/Sprites/PlayerHurt.png'),
              Path('Assets/Character/Sprites/PlayerIdle.png'),
              Path('Assets/Character/Sprites/PlayerJump.png'),
              Path('Assets/Character/Sprites/PlayerLand.png'),
              Path('Assets/Character/Sprites/PlayerRun.png'),
              Path('Assets/Character/Sprites/PlayerSpawn.png'),
              Path('Assets/Character/Sprites/PlayerVictory.png'),
          ]

          factor = 4
          for path in paths:
              with Image.open(path) as source:
                  image = source.convert('RGBA')
                  width, height = image.size
                  low_res = image.resize(
                      (max(1, width // factor), max(1, height // factor)),
                      Image.Resampling.NEAREST,
                  )
                  pixelated = low_res.resize(
                      (width, height),
                      Image.Resampling.NEAREST,
                  )
                  pixelated.save(path, format='PNG', optimize=True)
                  print(f'{path}: {width}x{height} -> {low_res.width}x{low_res.height} -> {width}x{height}')
          PY

      - name: Commit generated sprites
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Character/Sprites/PlayerDeath.png \
                  Assets/Character/Sprites/PlayerHurt.png \
                  Assets/Character/Sprites/PlayerIdle.png \
                  Assets/Character/Sprites/PlayerJump.png \
                  Assets/Character/Sprites/PlayerLand.png \
                  Assets/Character/Sprites/PlayerRun.png \
                  Assets/Character/Sprites/PlayerSpawn.png \
                  Assets/Character/Sprites/PlayerVictory.png
          git rm .github/workflows/pixelate-player-sprites.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Pixelate player sprite sheets [pixelated]"
          git push
